# Return 429 instead of the default 503
limit_req_status 429;
limit_req_log_level notice;

# General API protection
limit_req zone=borjak_api burst=30 nodelay;

# Sensitive endpoints
limit_req zone=borjak_login burst=5 nodelay;
limit_req zone=borjak_register burst=3 nodelay;
limit_req zone=borjak_sms burst=1 nodelay;
limit_req zone=borjak_verify_otp burst=5 nodelay;
limit_req zone=borjak_reset burst=3 nodelay;
limit_req zone=borjak_payment_request burst=5 nodelay;
limit_req zone=borjak_payment_verify burst=10 nodelay;