# Include inside the HTTPS `server { ... }` block of borjak.site (in addition to the rate-limit snippets).

# 1) Trusted client IP: OVERWRITE (never append) so clients cannot spoof it. The app derives rate-limit
#    keys from X-Real-IP (falls back to the LAST X-Forwarded-For hop).
#    Put these in the `location /` proxy block that forwards to 127.0.0.1:3000:
#      proxy_set_header Host              $host;
#      proxy_set_header X-Real-IP         $remote_addr;
#      proxy_set_header X-Forwarded-For   $remote_addr;
#      proxy_set_header X-Forwarded-Proto $scheme;
#    If Cloudflare/another CDN is in front, use the realip module with the CDN's published ranges instead.

# 2) Internal maintenance endpoint must never be reachable from the internet.
location ^~ /api/internal/ {
    allow 127.0.0.1;
    deny all;
}

# 3) Body size cap (assistant/cart endpoints also enforce their own limits).
client_max_body_size 6m;   # admin image upload; lower if uploads are smaller
