# General API requests
map $uri $borjak_api_key {
    default "";
    ~^/api/ $binary_remote_addr;
}

# Login
map $uri $borjak_login_key {
    default "";
    /api/auth/login $binary_remote_addr;
}

# Registration
map $uri $borjak_register_key {
    default "";
    /api/auth/register $binary_remote_addr;
}

# SMS and password recovery
map $uri $borjak_sms_key {
    default "";
    /api/auth/send-otp $binary_remote_addr;
    /api/auth/forgot-password $binary_remote_addr;
}

# OTP verification
map $uri $borjak_verify_otp_key {
    default "";
    /api/auth/verify-otp $binary_remote_addr;
}

# Password reset
map $uri $borjak_reset_key {
    default "";
    /api/auth/reset-password $binary_remote_addr;
}

# Payments
map $uri $borjak_payment_request_key {
    default "";
    /api/payment/request $binary_remote_addr;
}

map $uri $borjak_payment_verify_key {
    default "";
    /api/payment/verify $binary_remote_addr;
}

# Rate limit zones
limit_req_zone $borjak_api_key
    zone=borjak_api:5m rate=15r/s;

limit_req_zone $borjak_login_key
    zone=borjak_login:1m rate=10r/m;

limit_req_zone $borjak_register_key
    zone=borjak_register:1m rate=5r/m;

limit_req_zone $borjak_sms_key
    zone=borjak_sms:1m rate=3r/m;

limit_req_zone $borjak_verify_otp_key
    zone=borjak_verify_otp:1m rate=10r/m;

limit_req_zone $borjak_reset_key
    zone=borjak_reset:1m rate=5r/m;

limit_req_zone $borjak_payment_request_key
    zone=borjak_payment_request:1m rate=10r/m;

limit_req_zone $borjak_payment_verify_key
    zone=borjak_payment_verify:1m rate=20r/m;